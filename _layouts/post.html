---
layout: default
---
<article class="bg-white rounded-2xl shadow-sm border border-slate-200 p-5 sm:p-8 md:p-12">
  <header class="mb-6 border-b border-slate-100 pb-6">
    <div class="text-xs font-bold text-blue-600 mb-2 uppercase tracking-wider">구매 가이드 & 스펙 비교</div>
    <h1 class="text-2xl sm:text-3xl font-extrabold text-slate-900 leading-tight mb-3">{{ page.title | escape }}</h1>
    <div class="text-slate-400 text-xs flex items-center gap-2">
      <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%Y년 %m월 %d일" }}</time>
      <span>•</span>
      <span>검증 완료 에디터 픽</span>
    </div>
  </header>

  {% if page.image %}
  <div class="w-full aspect-video rounded-xl overflow-hidden mb-8 bg-slate-100 shadow-inner">
    <img src="{{ page.image | relative_url }}" class="w-full h-full object-cover" alt="Hero Image">
  </div>
  {% endif %}

  <div class="prose max-w-none text-slate-700">
    {{ content }}
  </div>

  <!-- 중단 광고 1개: 본문 완독 직후 배치. 위치/슬롯 변경 시 이 파일만 수정 → 전체 글 즉시 반영 -->
  <div class="ad-slot-wrap">
    <ins class="adsbygoogle"
         style="display:block"
         data-ad-client="ca-pub-2228289204702106"
         data-ad-slot="5979106011"
         data-ad-format="auto"
         data-full-width-responsive="true"></ins>
    <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
  </div>

</article>
